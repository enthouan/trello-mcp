<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title description">
  <title id="title">Choose between stdio and Streamable HTTP</title>
  <desc id="description">A local stdio client launches the Trello MCP server and passes Trello credentials to its child process. An HTTP client connects to a running service with an optional bearer token while Trello credentials remain on the server.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#EEF6FF"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2563EB"/>
    </marker>
    <marker id="arrowTeal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#0F766E"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; }
      .title { font-size: 30px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-size: 16px; font-weight: 400; fill: #475569; }
      .panel-title { font-size: 24px; font-weight: 700; fill: #0F172A; }
      .label { font-size: 15px; font-weight: 700; letter-spacing: 0.04em; }
      .body { font-size: 17px; font-weight: 500; fill: #334155; }
      .small { font-size: 14px; font-weight: 500; fill: #475569; }
      .box-title { font-size: 17px; font-weight: 700; fill: #0F172A; }
      .box-copy { font-size: 14px; font-weight: 500; fill: #475569; }
    </style>
  </defs>

  <rect width="1200" height="600" rx="28" fill="url(#background)"/>
  <text x="60" y="62" class="title">Choose a transport by where the server runs</text>
  <text x="60" y="91" class="subtitle">Both paths expose the same MCP tools; the credential boundary is different.</text>

  <g filter="url(#shadow)">
    <rect x="60" y="126" width="520" height="400" rx="24" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="2"/>
    <rect x="620" y="126" width="520" height="400" rx="24" fill="#FFFFFF" stroke="#99F6E4" stroke-width="2"/>
  </g>

  <rect x="88" y="150" width="112" height="30" rx="15" fill="#DBEAFE"/>
  <text x="144" y="171" text-anchor="middle" class="label" fill="#1D4ED8">LOCAL</text>
  <text x="88" y="215" class="panel-title">stdio</text>
  <text x="88" y="243" class="body">The client owns the server process.</text>

  <rect x="88" y="280" width="202" height="92" rx="16" fill="#EFF6FF" stroke="#93C5FD"/>
  <text x="189" y="312" text-anchor="middle" class="box-title">MCP client</text>
  <text x="189" y="339" text-anchor="middle" class="box-copy">launches Node</text>
  <text x="189" y="359" text-anchor="middle" class="box-copy">over stdin/stdout</text>

  <line x1="290" y1="326" x2="354" y2="326" stroke="#2563EB" stroke-width="4" marker-end="url(#arrowBlue)"/>

  <rect x="370" y="280" width="182" height="92" rx="16" fill="#EFF6FF" stroke="#93C5FD"/>
  <text x="461" y="312" text-anchor="middle" class="box-title">Server child</text>
  <text x="461" y="339" text-anchor="middle" class="box-copy">TRANSPORT=stdio</text>
  <text x="461" y="359" text-anchor="middle" class="box-copy">local build</text>

  <rect x="88" y="405" width="464" height="74" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/>
  <circle cx="113" cy="431" r="7" fill="#2563EB"/>
  <text x="132" y="436" class="box-title">Trello API key + token</text>
  <text x="113" y="461" class="small">Passed only in the child process environment</text>

  <rect x="648" y="150" width="188" height="30" rx="15" fill="#CCFBF1"/>
  <text x="742" y="171" text-anchor="middle" class="label" fill="#0F766E">SERVICE / DOCKER</text>
  <text x="648" y="215" class="panel-title">Streamable HTTP</text>
  <text x="648" y="243" class="body">The client connects to a running service.</text>

  <rect x="648" y="280" width="202" height="92" rx="16" fill="#F0FDFA" stroke="#5EEAD4"/>
  <text x="749" y="312" text-anchor="middle" class="box-title">MCP client</text>
  <text x="749" y="339" text-anchor="middle" class="box-copy">connects to /mcp</text>
  <text x="749" y="359" text-anchor="middle" class="box-copy">optional bearer</text>

  <line x1="850" y1="326" x2="914" y2="326" stroke="#0F766E" stroke-width="4" marker-end="url(#arrowTeal)"/>

  <rect x="930" y="280" width="182" height="92" rx="16" fill="#F0FDFA" stroke="#5EEAD4"/>
  <text x="1021" y="312" text-anchor="middle" class="box-title">Server service</text>
  <text x="1021" y="339" text-anchor="middle" class="box-copy">Docker or host</text>
  <text x="1021" y="359" text-anchor="middle" class="box-copy">keeps running</text>

  <rect x="648" y="405" width="464" height="74" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/>
  <circle cx="673" cy="431" r="7" fill="#0F766E"/>
  <text x="692" y="436" class="box-title">Trello credentials stay server-side</text>
  <text x="673" y="461" class="small">Clients receive only the URL and optional bearer token</text>

  <rect x="294" y="548" width="612" height="34" rx="17" fill="#0F172A"/>
  <text x="600" y="570" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">Loopback for local HTTP · HTTPS + access controls for remote HTTP</text>
</svg>
