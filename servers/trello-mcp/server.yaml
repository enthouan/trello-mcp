name: trello-mcp
image: mcp/trello-mcp
type: server
meta:
  category: productivity
  tags:
    - trello
    - productivity
    - project-management
about:
  title: Trello
  description: Manage Trello board, list, card, and workspace workflows through an independent community integration.
  icon: https://trello-mcp.com/favicon.svg
source:
  project: https://github.com/enthouan/trello-mcp
  commit: 17679f1484e8e255e745dc9a291b9cd587f7a44f
  dockerfile: Dockerfile
run:
  env:
    TRANSPORT: stdio
    LOG_LEVEL: info
  allowHosts:
    - api.trello.com:443
config:
  description: Configure Trello credentials
  secrets:
    - name: trello-mcp.api_key
      env: TRELLO_API_KEY
      example: <YOUR_TRELLO_API_KEY>
      required: true
    - name: trello-mcp.token
      env: TRELLO_TOKEN
      example: <YOUR_TRELLO_TOKEN>
      required: true
