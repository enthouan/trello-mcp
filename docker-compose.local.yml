######################
# Environment        #
######################

### Required
# - TRELLO_API_KEY
# - TRELLO_TOKEN

### Service-Specific
# - TRELLO_MCP_HOST_BIND_IP:-127.0.0.1
# - TRELLO_MCP_HOST_PORT:-3000
# - TRELLO_MCP_NETWORK:-trello-mcp_network
# - TRANSPORT:-http
# - LOG_LEVEL:-info
# - MCP_AUTH_TOKEN:-
# - TRELLO_RATE_LIMIT_CAPACITY:-100
# - TRELLO_RATE_LIMIT_REFILL_INTERVAL_MS:-10000
# - TRELLO_RETRY_MAX_ATTEMPTS:-3
# - TRELLO_RETRY_BASE_DELAY_MS:-100
# - TRELLO_RETRY_MAX_DELAY_MS:-2000

#########################
# Global Configurations #
#########################

## Network
networks:
  trello-mcp_network:
    name: ${TRELLO_MCP_NETWORK:-trello-mcp_network}
    driver: bridge

services:
  trello-mcp:
    container_name: trello-mcp-local
    build:
      context: .
    image: trello-mcp:local
    ports:
      - "${TRELLO_MCP_HOST_BIND_IP:-127.0.0.1}:${TRELLO_MCP_HOST_PORT:-3000}:3000"
    environment:
      - TRELLO_API_KEY=${TRELLO_API_KEY:?Set TRELLO_API_KEY in .env}
      - TRELLO_TOKEN=${TRELLO_TOKEN:?Set TRELLO_TOKEN in .env}
      - TRANSPORT=${TRANSPORT:-http}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - MCP_AUTH_TOKEN=${MCP_AUTH_TOKEN:-}
      - TRELLO_RATE_LIMIT_CAPACITY=${TRELLO_RATE_LIMIT_CAPACITY:-100}
      - TRELLO_RATE_LIMIT_REFILL_INTERVAL_MS=${TRELLO_RATE_LIMIT_REFILL_INTERVAL_MS:-10000}
      - TRELLO_RETRY_MAX_ATTEMPTS=${TRELLO_RETRY_MAX_ATTEMPTS:-3}
      - TRELLO_RETRY_BASE_DELAY_MS=${TRELLO_RETRY_BASE_DELAY_MS:-100}
      - TRELLO_RETRY_MAX_DELAY_MS=${TRELLO_RETRY_MAX_DELAY_MS:-2000}
    networks:
      - trello-mcp_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
