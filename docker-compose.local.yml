######################
# Environment        #
######################

### Required
# - TRELLO_API_KEY
# - TRELLO_TOKEN

### Common
# - TIMEZONE

### Service-Specific
# - TRELLO_MCP_HOST_PORT
# - TRELLO_MCP_NETWORK
# - TRANSPORT
# - LOG_LEVEL

#########################
# Global Configurations #
#########################

## Network
networks:
  trello_mcp:
    name: ${TRELLO_MCP_NETWORK:-trello_mcp}
    driver: bridge

services:
  trello-mcp:
    container_name: trello-mcp-local
    build:
      context: .
    image: trello-mcp:local
    ports:
      - "${TRELLO_MCP_HOST_PORT:-3000}:3000"
    environment:
      - TZ=${TIMEZONE:-UTC}
      - TRELLO_API_KEY=${TRELLO_API_KEY:?Set TRELLO_API_KEY in .env}
      - TRELLO_TOKEN=${TRELLO_TOKEN:?Set TRELLO_TOKEN in .env}
      - TRANSPORT=${TRANSPORT:-http}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    networks:
      - trello_mcp
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
