# Default Compose values (override through environment variables or .env):
# - TRELLO_MCP_IMAGE:-trello-mcp:local
# - TRELLO_MCP_CONTAINER_NAME:-trello-mcp-local
# - TRELLO_MCP_HOST_PORT:-3000
# - TRELLO_MCP_NETWORK:-trello-mcp-local_network
# - PORT:-3000

services:
  trello-mcp:
    build:
      context: .
    image: ${TRELLO_MCP_IMAGE:-trello-mcp:local}
    container_name: ${TRELLO_MCP_CONTAINER_NAME:-trello-mcp-local}
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${TRELLO_MCP_HOST_PORT:-3000}:${PORT:-3000}"
    networks:
      - trello-mcp-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${PORT:-3000}/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  trello-mcp-network:
    name: ${TRELLO_MCP_NETWORK:-trello-mcp-local_network}
