<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1200, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>trello-mcp Open Graph image</title>
    <style>
      /*
       * Portable social-card template.
       * To reuse it for another MCP project, update these tokens, the copy,
       * and the inline mark. Keep the 1200 × 630 canvas unchanged.
       */
      :root {
        --og-canvas: #f1f6ff;
        --og-panel: #ffffff;
        --og-panel-tint: #edf5ff;
        --og-border: #d6e0ee;
        --og-accent: #146acb;
        --og-accent-bright: #579dff;
        --og-title: #172b4d;
        --og-muted: #44546f;
        --og-proof: #09326c;
        --og-mark: #146acb;
        --og-mark-detail: #ffffff;
        --og-shadow: rgb(9 50 108 / 14%);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        margin: 0;
        overflow: hidden;
      }

      body {
        font-family:
          Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }

      .og-card {
        position: relative;
        display: grid;
        width: 1200px;
        height: 630px;
        padding: 66px 72px;
        overflow: hidden;
        color: var(--og-title);
        background:
          radial-gradient(
            circle at 90% 12%,
            rgb(87 157 255 / 28%),
            transparent 290px
          ),
          var(--og-canvas);
      }

      .frame {
        position: relative;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 238px;
        gap: 50px;
        width: 1056px;
        height: 498px;
        padding: 46px 48px 44px;
        overflow: hidden;
        background: linear-gradient(
          132deg,
          var(--og-panel) 0%,
          var(--og-panel) 70%,
          var(--og-panel-tint) 100%
        );
        border: 2px solid var(--og-border);
        border-radius: 28px;
        box-shadow: 0 24px 70px var(--og-shadow);
      }

      .copy {
        display: flex;
        min-width: 0;
        flex-direction: column;
      }

      .project {
        display: flex;
        gap: 14px;
        align-items: center;
        margin: 0;
        color: var(--og-accent);
        font-family:
          ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
        font-size: 32px;
        font-weight: 750;
        letter-spacing: -0.035em;
      }

      .project::before {
        width: 14px;
        height: 14px;
        flex: 0 0 auto;
        content: "";
        background: var(--og-accent-bright);
        border: 4px solid rgb(87 157 255 / 25%);
        border-radius: 999px;
        background-clip: padding-box;
      }

      h1 {
        margin: 44px 0 0;
        color: var(--og-title);
        font-size: 62px;
        font-weight: 760;
        letter-spacing: -0.045em;
        line-height: 1.08;
      }

      h1 span {
        display: block;
        white-space: nowrap;
      }

      .subtitle {
        margin: 25px 0 0;
        color: var(--og-muted);
        font-size: 28px;
        line-height: 1.25;
      }

      .proof {
        display: flex;
        gap: 14px;
        align-items: center;
        margin-top: auto;
        padding-top: 26px;
        color: var(--og-proof);
        font-family:
          ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
        font-size: 20px;
        font-weight: 600;
        line-height: 1;
        white-space: nowrap;
        border-top: 2px solid var(--og-border);
      }

      .proof-separator {
        color: var(--og-accent-bright);
      }

      .brand {
        display: flex;
        flex-direction: column;
        gap: 24px;
        align-items: center;
        justify-content: center;
      }

      .mark {
        display: grid;
        width: 196px;
        height: 196px;
        place-items: center;
        filter: drop-shadow(0 20px 32px rgb(20 106 203 / 22%));
      }

      .mark svg {
        display: block;
        width: 196px;
        height: 196px;
      }

      .identity {
        margin: 0;
        color: var(--og-muted);
        font-family:
          ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
        font-size: 20px;
        font-weight: 650;
        letter-spacing: -0.02em;
      }
    </style>
  </head>
  <body>
    <main
      class="og-card"
      data-social-card
      aria-label="trello-mcp — independent, self-hosted Trello MCP server"
    >
      <section class="frame">
        <div class="copy">
          <p class="project">trello-mcp</p>
          <h1>
            <span>Manage Trello from</span>
            <span>your MCP client.</span>
          </h1>
          <p class="subtitle">Self-hosted, auditable Trello automation.</p>
          <div class="proof">
            <span>Streamable HTTP</span>
            <span class="proof-separator" aria-hidden="true">•</span>
            <span>stdio</span>
            <span class="proof-separator" aria-hidden="true">•</span>
            <span>schema-validated tools</span>
          </div>
        </div>
        <div class="brand">
          <div class="mark" aria-hidden="true">
            <svg viewBox="0 0 64 64" role="presentation">
              <rect width="64" height="64" rx="14" fill="var(--og-mark)" />
              <rect
                x="14"
                y="15"
                width="29"
                height="9"
                rx="3"
                fill="var(--og-mark-detail)"
              />
              <rect
                x="21"
                y="28"
                width="29"
                height="9"
                rx="3"
                fill="var(--og-mark-detail)"
              />
              <rect
                x="14"
                y="41"
                width="23"
                height="9"
                rx="3"
                fill="var(--og-mark-detail)"
              />
            </svg>
          </div>
          <p class="identity">Independent community project</p>
        </div>
      </section>
    </main>
  </body>
</html>
