<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title description">
  <title id="title">Choose between stdio and Streamable HTTP</title>
  <desc id="description">A local stdio client launches the Trello MCP server and passes Trello credentials to its child process. An HTTP client connects to a running service with an optional bearer token while Trello credentials remain on the server.</desc>
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path class="local-arrow-head" d="M0,0 L10,5 L0,10 Z" fill="#2563EB"/>
    </marker>
    <marker id="arrowTeal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path class="http-arrow-head" d="M0,0 L10,5 L0,10 Z" fill="#0F766E"/>
    </marker>
    <style>
      :root { color-scheme: light dark; }
      text { font-family: Arial, Helvetica, sans-serif; }
      .title { font-size: 30px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-size: 16px; font-weight: 400; fill: #475569; }
      .panel-title { font-size: 24px; font-weight: 700; fill: #0F172A; }
      .label { font-size: 15px; font-weight: 700; letter-spacing: 0.04em; }
      .body { font-size: 17px; font-weight: 500; fill: #334155; }
      .small { font-size: 14px; font-weight: 500; fill: #475569; }
      .box-title { font-size: 17px; font-weight: 700; fill: #0F172A; }
      .box-copy { font-size: 14px; font-weight: 500; fill: #475569; }

      @media (prefers-color-scheme: dark) {
        .canvas { fill: #0C1624; }
        .title, .panel-title, .box-title { fill: #F8FAFC; }
        .subtitle, .small, .box-copy { fill: #CBD5E1; }
        .body { fill: #E2E8F0; }
        .panel { fill: #111C2E; }
        .local-panel { stroke: #3B82F6; }
        .http-panel { stroke: #2DD4BF; }
        .local-badge { fill: #16345D; }
        .local-label { fill: #93C5FD; }
        .http-badge { fill: #123F3C; }
        .http-label { fill: #5EEAD4; }
        .local-flow-box { fill: #102A4C; stroke: #60A5FA; }
        .http-flow-box { fill: #0F3332; stroke: #2DD4BF; }
        .credential-box { fill: #162033; stroke: #475569; }
        .local-dot, .local-arrow-head { fill: #579DFF; }
        .local-arrow-line { stroke: #579DFF; }
        .http-dot, .http-arrow-head { fill: #2DD4BF; }
        .http-arrow-line { stroke: #2DD4BF; }
        .footer-band { fill: #172B4D; }
        .footer-copy { fill: #F8FAFC; }
      }
    </style>
  </defs>

  <rect class="canvas" width="1200" height="600" rx="8" fill="#F7F8FA"/>
  <text x="60" y="62" class="title">Choose a transport by where the server runs</text>
  <text x="60" y="91" class="subtitle">Both paths expose the same MCP tools; the credential boundary is different.</text>

  <g>
    <rect class="panel local-panel" x="60" y="126" width="520" height="400" rx="8" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="2"/>
    <rect class="panel http-panel" x="620" y="126" width="520" height="400" rx="8" fill="#FFFFFF" stroke="#99F6E4" stroke-width="2"/>
  </g>

  <rect class="local-badge" x="88" y="150" width="112" height="30" rx="4" fill="#DBEAFE"/>
  <text x="144" y="171" text-anchor="middle" class="label local-label" fill="#1D4ED8">LOCAL</text>
  <text x="88" y="215" class="panel-title">stdio</text>
  <text x="88" y="243" class="body">The client owns the server process.</text>

  <rect class="local-flow-box" x="88" y="280" width="202" height="92" rx="8" fill="#EFF6FF" stroke="#93C5FD"/>
  <text x="189" y="312" text-anchor="middle" class="box-title">MCP client</text>
  <text x="189" y="339" text-anchor="middle" class="box-copy">launches Node</text>
  <text x="189" y="359" text-anchor="middle" class="box-copy">over stdin/stdout</text>

  <line class="local-arrow-line" x1="290" y1="326" x2="354" y2="326" stroke="#2563EB" stroke-width="4" marker-end="url(#arrowBlue)"/>

  <rect class="local-flow-box" x="370" y="280" width="182" height="92" rx="8" fill="#EFF6FF" stroke="#93C5FD"/>
  <text x="461" y="312" text-anchor="middle" class="box-title">Server child</text>
  <text x="461" y="339" text-anchor="middle" class="box-copy">TRANSPORT=stdio</text>
  <text x="461" y="359" text-anchor="middle" class="box-copy">local build</text>

  <rect class="credential-box" x="88" y="405" width="464" height="74" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
  <circle class="local-dot" cx="113" cy="431" r="7" fill="#2563EB"/>
  <text x="132" y="436" class="box-title">Trello API key + token</text>
  <text x="113" y="461" class="small">Passed only in the child process environment</text>

  <rect class="http-badge" x="648" y="150" width="188" height="30" rx="4" fill="#CCFBF1"/>
  <text x="742" y="171" text-anchor="middle" class="label http-label" fill="#0F766E">SERVICE / DOCKER</text>
  <text x="648" y="215" class="panel-title">Streamable HTTP</text>
  <text x="648" y="243" class="body">The client connects to a running service.</text>

  <rect class="http-flow-box" x="648" y="280" width="202" height="92" rx="8" fill="#F0FDFA" stroke="#5EEAD4"/>
  <text x="749" y="312" text-anchor="middle" class="box-title">MCP client</text>
  <text x="749" y="339" text-anchor="middle" class="box-copy">connects to /mcp</text>
  <text x="749" y="359" text-anchor="middle" class="box-copy">optional bearer</text>

  <line class="http-arrow-line" x1="850" y1="326" x2="914" y2="326" stroke="#0F766E" stroke-width="4" marker-end="url(#arrowTeal)"/>

  <rect class="http-flow-box" x="930" y="280" width="182" height="92" rx="8" fill="#F0FDFA" stroke="#5EEAD4"/>
  <text x="1021" y="312" text-anchor="middle" class="box-title">Server service</text>
  <text x="1021" y="339" text-anchor="middle" class="box-copy">Docker or host</text>
  <text x="1021" y="359" text-anchor="middle" class="box-copy">keeps running</text>

  <rect class="credential-box" x="648" y="405" width="464" height="74" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
  <circle class="http-dot" cx="673" cy="431" r="7" fill="#0F766E"/>
  <text x="692" y="436" class="box-title">Trello credentials stay server-side</text>
  <text x="673" y="461" class="small">Clients receive only the URL and optional bearer token</text>

  <rect class="footer-band" x="294" y="548" width="612" height="34" rx="8" fill="#0F172A"/>
  <text class="footer-copy" x="600" y="570" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">Loopback for local HTTP · HTTPS + access controls for remote HTTP</text>
</svg>
