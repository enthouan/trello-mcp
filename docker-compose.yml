services:
  trello-mcp:
    image: ghcr.io/enthouan/trello-mcp:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TRANSPORT: http
      PORT: 3000
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
