# Default Compose values (override through environment variables or .env):
# - TRELLO_MCP_IMAGE:-latest
#   latest follows main; set to a version tag like 0.1.1 for a pinned release.
# - TRELLO_MCP_CONTAINER_NAME:-trello-mcp
# - TRELLO_MCP_HOST_PORT:-3000
# - TRELLO_MCP_NETWORK:-trello-mcp_network

services:
  trello-mcp:
    image: ghcr.io/enthouan/trello-mcp:${TRELLO_MCP_IMAGE:-latest}
    container_name: ${TRELLO_MCP_CONTAINER_NAME:-trello-mcp}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: ${TRELLO_MCP_HOST_PORT:-3000}
    ports:
      - "${TRELLO_MCP_HOST_PORT:-3000}:${TRELLO_MCP_HOST_PORT:-3000}"
    networks:
      - trello-mcp-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${TRELLO_MCP_HOST_PORT:-3000}/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  trello-mcp-network:
    name: ${TRELLO_MCP_NETWORK:-trello-mcp_network}
