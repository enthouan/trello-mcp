version: 2
updates:
  # Cadence and grouping are intentionally conservative for review stability:
  # version checks on the 1st and 15th of each month, low PR limits, grouped
  # minor/patch updates, and separate majors. Security updates remain enabled
  # independently of these routine version-update schedules.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 9 1,15 * *"
      timezone: "America/Los_Angeles"
    cooldown:
      semver-patch-days: 1
      semver-minor-days: 1
      semver-major-days: 30
    open-pull-requests-limit: 4
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
    groups:
      production-minor-patch:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      development-minor-patch:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

  # Stagger workflow action updates from npm to keep review volume predictable.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 10 1,15 * *"
      timezone: "America/Los_Angeles"
    cooldown:
      default-days: 1
    open-pull-requests-limit: 2
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Docker base image updates follow the same cadence, grouped for minor/patch bumps.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 11 1,15 * *"
      timezone: "America/Los_Angeles"
    cooldown:
      default-days: 1
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "node"
        update-types:
          - "version-update:semver-major"
    groups:
      docker-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
