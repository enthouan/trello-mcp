version: 2
updates:
  # Cadence and grouping are intentionally conservative before public launch:
  # weekly checks, low PR limits, grouped minor/patch updates, and separate majors.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 4
    groups:
      production-minor-patch:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      development-minor-patch:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

  # Stagger workflow action updates from npm to keep review volume predictable.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "10:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 2
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Docker base image updates stay weekly and grouped only for minor/patch bumps.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "11:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 2
    groups:
      docker-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
