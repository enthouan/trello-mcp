name: Live Trello Smoke

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      board_ref:
        description: "Disposable Trello smoke board id, short link, or URL."
        required: true
        default: "hUaItfNq"
        type: string

permissions:
  contents: read

jobs:
  smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment:
      name: live-smoke
      deployment: false
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.1
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test
      - name: Skip live Trello smoke for Dependabot PRs
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
        run: |
          {
            echo "### Live Trello Smoke"
            echo
            echo "Skipped pnpm smoke:live for this Dependabot PR."
            echo "Dependabot pull_request workflows do not receive GitHub Actions secrets, so the offline setup, typecheck, lint, build, and test steps satisfy this required smoke check without exposing Trello credentials."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Run live Trello smoke
        if: github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]'
        run: pnpm smoke:live
        env:
          TRELLO_LIVE_SMOKE: "1"
          TRELLO_LIVE_SMOKE_BOARD_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.board_ref || vars.TRELLO_LIVE_SMOKE_BOARD_ID || 'hUaItfNq' }}
          TRELLO_API_KEY: ${{ secrets.TRELLO_LIVE_SMOKE_API_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_LIVE_SMOKE_TOKEN }}
