name: Build and Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4.4.0
        with:
          version: 10.34.1
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: pnpm install
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test:coverage
