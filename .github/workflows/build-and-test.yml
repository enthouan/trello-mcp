name: Build and Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test:coverage

  website:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SITE_URL: https://example.invalid
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:check
      - run: pnpm site:og:check
      - run: pnpm site:check
      - run: pnpm site:build
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm site:test
      - run: pnpm site:visual
      - run: pnpm site:lighthouse
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: website-qa
          path: |
            website/artifacts/
            website/playwright-report/
            website/test-results/
          if-no-files-found: warn
          retention-days: 14

  deploy-website:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, website]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      deployments: write
    concurrency:
      group: deploy-website-production
      cancel-in-progress: true
    env:
      SITE_URL: https://trello-mcp.com
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm site:og:check
      - run: pnpm site:build
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy website/dist --project-name=trello-mcp --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
