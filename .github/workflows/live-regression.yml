name: Live Trello Regression

on:
  workflow_dispatch:
    inputs:
      domains:
        description: "Optional comma-separated regression domains to run."
        required: false
        type: string
      tools:
        description: "Optional comma-separated tool names to run."
        required: false
        type: string

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    environment:
      name: live-regression
      deployment: false
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.34.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test
      - run: pnpm regression:live
        env:
          TRELLO_LIVE_REGRESSION: "1"
          TRELLO_LIVE_REQUIRE_PUBLIC_BOARD: "1"
          TRELLO_LIVE_REGRESSION_BOARD_ID: "hUaItfNq"
          TRELLO_LIVE_REGRESSION_SECONDARY_BOARD_ID: "r9BpowfZ"
          TRELLO_LIVE_REGRESSION_DOMAINS: ${{ inputs.domains }}
          TRELLO_LIVE_REGRESSION_TOOLS: ${{ inputs.tools }}
          TRELLO_LIVE_REGRESSION_REPORT_JSON: reports/live-regression.json
          TRELLO_API_KEY: ${{ secrets.TRELLO_LIVE_REGRESSION_API_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_LIVE_REGRESSION_TOKEN }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: live-regression-report
          path: reports/live-regression.json
          if-no-files-found: ignore
